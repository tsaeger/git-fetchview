# Runs the same command as a local `cargo xtask ci`, inside the Nix dev shell
# that flake.lock and rust-toolchain.toml pin.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The runners stay on the *-latest labels. Nix pins the toolchain and every
# tool from flake.lock, so the host OS matters little, and a pinned image would
# need a bump when GitHub retires it. If a label move breaks a job, pin that job
# to the previous image and say why here.
jobs:
  ci:
    name: ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # The docs checks need the npm dev tools; `ci` fails under CI without them.
      - run: nix develop --command npm ci
      - run: nix develop --command cargo xtask ci

  msrv:
    name: msrv (1.88.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix develop .#msrv --command cargo check --workspace --all-targets --locked

  flake:
    name: flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix flake check

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix develop --command cargo xtask coverage --lcov
      - name: Summary
        run: |
          {
            echo '## Coverage'
            echo '```'
            nix develop --command cargo llvm-cov report --ignore-filename-regex '(^|/)(xtask|fuzz)/|src/main\.rs|src/bin/'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: target/llvm-cov/lcov.info
