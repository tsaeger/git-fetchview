[package]
name = "git-fetchview"
version = "0.1.0"
edition = "2024"
description = "Pick a remote and ref, fetch it, and open it in tig, printing the plain git commands as you go"
license = "MIT"
authors = ["Tom Saeger <tom.saeger@gmail.com>"]
rust-version = "1.88.0"

[lints]
workspace = true

[lib]
name = "git_fetchview"

[[bin]]
name = "git-fetchview"
path = "src/main.rs"

[[bin]]
name = "git-fv"
path = "src/bin/git-fv.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
ratatui = "0.30.2"
regex = "1.13.1"
thiserror = "2.0.21"

[workspace]
members = [".", "xtask"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
opt-level = "z"     # optimize for size
lto = "fat"         # whole-program link-time optimization
codegen-units = 1   # better optimization, slower build
panic = "abort"     # drop unwinding machinery
strip = "symbols"   # remove symbols and debuginfo

[dev-dependencies]
portable-pty = "0.9"
tempfile = "3.27.0"
vt100 = "0.18"
